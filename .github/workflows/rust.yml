name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Run cargo clippy
        run: nix develop --command cargo clippy -- --deny warnings

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Run cargo fmt
        run: nix develop --command cargo fmt --all -- --check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Run cargo nextest
        run: nix develop --command cargo nextest run
      # The workspace run uses the facade's default features (sim, tokio), so
      # cargo skips this example and its regression test: it needs the hyper
      # and prometheus facade features too.
      - name: Run the metastable retry-storm example test
        run: nix develop --command cargo nextest run -p moonpool --features sim,hyper,prometheus --example metastable_grpc_retry_storm

  # moonpool-rpc over real localhost TCP on both Tokio flavors: open-loop
  # unary load, reply streams, an overload burst and its recovery, every
  # runtime back at its resource baseline. The smoke mode checks invariants,
  # not latency (the full run's numbers are recorded in
  # docs/plans/moonpool-rpc/qualification.md).
  rpc-soak:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: moonpool-rpc real-network soak (smoke)
        run: nix develop --command cargo run -p moonpool-rpc-sim --example rpc_soak -- --smoke

  # The simulation must stay buildable without the fork-based explorer (libc) so
  # it can compile to wasm. Guards the explorer-optional path + the wasm target.
  portability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Clippy (no exploration, all targets)
        run: nix develop --command cargo clippy -p moonpool-sim --no-default-features --all-targets -- --deny warnings
      - name: Tests (no exploration)
        run: nix develop --command cargo nextest run -p moonpool-sim --no-default-features
      # The workspace-level nextest run unifies features with moonpool-sim,
      # which turns on `deterministic-select`, so core's tokio-passthrough
      # `select!` tests (tests/select_passthrough.rs) compile to nothing there.
      # Building core alone is the only way they run.
      - name: Tests (moonpool-core select passthrough)
        run: nix develop --command cargo nextest run -p moonpool-core --features select
      - name: Build for wasm32-unknown-unknown
        run: |
          nix develop --command cargo check --target wasm32-unknown-unknown -p moonpool-assertions
          nix develop --command cargo check --target wasm32-unknown-unknown -p moonpool-journal
          nix develop --command cargo check --target wasm32-unknown-unknown -p moonpool-sim --no-default-features
          nix develop --command cargo check --target wasm32-unknown-unknown -p moonpool-wasm-demo
          nix develop --command cargo check --target wasm32-unknown-unknown -p moonpool-rpc
          nix develop --command cargo check --target wasm32-unknown-unknown -p moonpool-rpc --no-default-features
      - name: moonpool-rpc without its codec feature
        run: nix develop --command cargo clippy -p moonpool-rpc --no-default-features --all-targets -- --deny warnings
      - name: moonpool-rpc with its optional derive
        run: nix develop --command cargo clippy -p moonpool-rpc -p moonpool-rpc-derive --features moonpool-rpc/derive --all-targets -- --deny warnings
      # The native security adapters (rustls + ring, jsonwebtoken) are
      # non-default features: they do not build for wasm32, and the
      # workspace test run enables only `jwt` (through moonpool-rpc-sim).
      # Their real-TLS and real-token tests run here.
      - name: moonpool-rpc with its native security features
        run: |
          nix develop --command cargo clippy -p moonpool-rpc --features tls,jwt --all-targets -- --deny warnings
          # Only what the features add (the rest runs in the test job):
          # the tests/tls.rs binary and every jwt test (security::jwt
          # unit tests, tests/security.rs's jwt module).
          nix develop --command cargo nextest run -p moonpool-rpc --features tls,jwt -E 'binary(tls) | test(/jwt/)'
      # nextest skips doctests; the RPC crate's examples and compile-fail
      # doctests (derive included) run here.
      - name: moonpool-rpc doctests
        run: nix develop --command cargo test -p moonpool-rpc --features derive --doc
      - name: Build without any rustflags (no tokio_unstable required)
        run: |
          # Issue #151 acceptance: a consumer on stable with no .cargo/config.toml
          # rustflags must be able to build every published crate.
          RUSTFLAGS="" nix develop --command cargo check \
            -p moonpool-assertions \
            -p moonpool-buggify \
            -p moonpool-core \
            -p moonpool-explorer \
            -p moonpool-hyper \
            -p moonpool-journal \
            -p moonpool-prometheus \
            -p moonpool-rpc \
            -p moonpool-rpc-derive \
            -p moonpool-sim \
            -p moonpool
      - name: Lean production dependency tree excludes sim/explorer
        run: |
          tree=$(nix develop --command cargo tree -p moonpool --no-default-features --features tokio -e no-dev)
          echo "$tree"
          if echo "$tree" | grep -qE "moonpool-sim|moonpool-explorer|moonpool-assertions"; then
            echo "::error::lean production build pulled in a sim/explorer crate"
            exit 1
          fi
          if echo "$tree" | grep -qE "moonpool-hyper|hyper v|h2 v"; then
            echo "::error::lean production build pulled in hyper"
            exit 1
          fi
          if echo "$tree" | grep -qE "moonpool-prometheus|prometheus v"; then
            echo "::error::lean production build pulled in prometheus"
            exit 1
          fi
      - name: moonpool-rpc production tree excludes sim/explorer
        run: |
          for features in "--no-default-features" "" "--features tls,jwt"; do
            tree=$(nix develop --command cargo tree -p moonpool-rpc $features -e no-dev)
            echo "$tree"
            if echo "$tree" | grep -qE "moonpool-sim|moonpool-explorer|moonpool-assertions|moonpool-buggify|tokio v"; then
              echo "::error::moonpool-rpc ($features) pulled in a sim/explorer crate or a tokio runtime"
              exit 1
            fi
            # The derive is opt-in: no proc-macro crate of ours by default.
            if echo "$tree" | grep -qE "moonpool-rpc-derive"; then
              echo "::error::moonpool-rpc ($features) pulled in the optional derive"
              exit 1
            fi
          done
          # Declining the native security features keeps their crates out.
          tree=$(nix develop --command cargo tree -p moonpool-rpc -e no-dev)
          if echo "$tree" | grep -qE "rustls|ring v|jsonwebtoken"; then
            echo "::error::moonpool-rpc pulled in TLS/JWT crates without their features"
            exit 1
          fi
      - name: Facade rpc feature is optional and hyper stays RPC-independent
        run: |
          lean=$(nix develop --command cargo tree -p moonpool --no-default-features --features tokio -e no-dev)
          if echo "$lean" | grep -qE "moonpool-rpc"; then
            echo "::error::the lean facade pulled in moonpool-rpc"
            exit 1
          fi
          rpc=$(nix develop --command cargo tree -p moonpool --no-default-features --features tokio,rpc -e no-dev)
          echo "$rpc"
          if ! echo "$rpc" | grep -qE "moonpool-rpc v"; then
            echo "::error::the rpc facade feature did not pull in moonpool-rpc"
            exit 1
          fi
          if echo "$rpc" | grep -qE "moonpool-sim|moonpool-explorer|moonpool-hyper|moonpool-rpc-derive|rustls|ring v|jsonwebtoken"; then
            echo "::error::the rpc facade feature pulled in more than moonpool-rpc"
            exit 1
          fi
          hyper=$(nix develop --command cargo tree -p moonpool-hyper -e no-dev)
          if echo "$hyper" | grep -qE "moonpool-rpc"; then
            echo "::error::moonpool-hyper depends on moonpool-rpc"
            exit 1
          fi
          nix develop --command cargo check -p moonpool --no-default-features --features tokio,rpc
          nix develop --command cargo check -p moonpool --no-default-features --features tokio,rpc-tls,rpc-jwt,rpc-derive

  # The fork-based explorer must keep working on macOS, not just Linux: same
  # POSIX surface (fork/waitpid/mmap MAP_SHARED), but darwin is the platform
  # where fork-without-exec and Mach-O sancov sections would regress silently.
  # Runs the explorer + sim unit tests and one real fork-based exploration
  # binary (frontier-explore instruments moonpool_explorer itself, so it also
  # covers the sancov wrapper pipeline on darwin).
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Run explorer and sim tests
        run: nix develop --command cargo nextest run -p moonpool-explorer -p moonpool-sim
      # moonpool-rpc's real-network suites (both Tokio flavors) on darwin's
      # socket stack: the platform half of the RPC qualification (#219).
      - name: Run moonpool-rpc real-network tests
        run: nix develop --command cargo nextest run -p moonpool-rpc
      - name: moonpool-rpc real-network soak (smoke)
        timeout-minutes: 20
        run: nix develop --command cargo run -p moonpool-rpc-sim --example rpc_soak -- --smoke
      - name: Run fork-based exploration simulation
        run: nix develop --command cargo xtask sim run frontier-explore

  sim:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sim:
          - maze-explore
          - dungeon-explore
          - frontier-explore
          - axum-web
          - metrics-service
          - topology
          - tonic-grpc
          - journal
          - rpc-foundations
          - rpc-delivery
          - rpc-interfaces
          - rpc-balance
          - rpc-streams
          - rpc-security
          - rpc-qualification
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Run simulation ${{ matrix.sim }}
        run: nix develop --command cargo xtask sim run ${{ matrix.sim }}

  # Build the full book (wasm demo + mdbook) on every PR/push. pages.yml only
  # deploys from main, so without this a wasm-bindgen drift or a broken demo/doc
  # lands on main before anyone notices. Mirrors pages.yml's build steps minus
  # the deploy.
  book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Build and stage the wasm demo embedded in the book
        run: nix develop --command book/build-wasm-demo.sh
      - name: Build book
        run: nix develop --command mdbook build
