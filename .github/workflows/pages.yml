name: Deploy the site to GitHub Pages

# The site (website/site/, an Astro app with The Sim Book in it as the Guide).
# The `website` job of rust.yml builds it on each pull request; this workflow
# publishes the build output from main.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  NIX_CONFIG: |
    connect-timeout = 60
    download-attempts = 10

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Build the wasm demo and stage it in the site
        run: nix develop --command website/site/scripts/build-wasm-demo.sh
      - name: Build the site
        run: nix develop --command bash -c 'cd website/site && npm ci --no-audit --no-fund && npm run build'
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./website/site/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
