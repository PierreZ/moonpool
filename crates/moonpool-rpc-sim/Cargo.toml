[package]
name = "moonpool-rpc-sim"
version.workspace = true
publish = false
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Deterministic-simulation harness, oracles and campaigns for moonpool-rpc"

# The simulation side of moonpool-rpc lives here so the published crate never
# depends on moonpool-sim, even through a feature.
[dependencies]
# `derive`: the interfaces campaign serves its role interface through the
# generated dispatcher, next to hand-written well-known endpoints.
# `jwt`: the security campaign verifies real signed tokens (EdDSA, which
# signs deterministically) with the production JWT/JWKS adapter, under an
# injected UTC; the simulation is never built for wasm.
moonpool-rpc = { path = "../moonpool-rpc", version = "0.8.0", features = ["derive", "jwt"] }
moonpool-sim = { path = "../moonpool-sim", version = "0.8.0" }

async-trait = "0.1"
futures = "0.3"
# Token issuance in the security campaign (the verifier is moonpool-rpc's).
jsonwebtoken = { version = "11.1", default-features = false, features = ["rust_crypto"] }
serde_json = "1"
# `#[derive(prost::Message)]` expands to `::prost` paths.
prost = "0.14"
tracing = "0.1"

[dev-dependencies]
# The real-TCP example runs the same RPC code on the production providers.
moonpool-core = { path = "../moonpool-core", version = "0.8.0", features = ["tokio-providers"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync"] }
tracing = "0.1"

[[bin]]
name = "sim-rpc-foundations"
path = "src/bin/sim/rpc_foundations.rs"

[[bin]]
name = "sim-rpc-delivery"
path = "src/bin/sim/rpc_delivery.rs"

[[bin]]
name = "sim-rpc-interfaces"
path = "src/bin/sim/rpc_interfaces.rs"

[[bin]]
name = "sim-rpc-balance"
path = "src/bin/sim/rpc_balance.rs"

[[bin]]
name = "sim-rpc-streams"
path = "src/bin/sim/rpc_streams.rs"

[[bin]]
name = "sim-rpc-security"
path = "src/bin/sim/rpc_security.rs"

[[bin]]
name = "sim-rpc-qualification"
path = "src/bin/sim/rpc_qualification.rs"

[lints]
workspace = true
