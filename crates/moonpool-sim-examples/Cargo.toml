[package]
name = "moonpool-sim-examples"
version.workspace = true
publish = false
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Example simulation workloads for moonpool"
documentation = "https://docs.rs/moonpool-sim-examples"

[dependencies]
moonpool-sim = { path = "../moonpool-sim", version = "0.8.0" }
moonpool-hyper = { path = "../moonpool-hyper", version = "0.8.0" }
moonpool-prometheus = { path = "../moonpool-prometheus", version = "0.8.0" }

async-trait = "0.1"
futures = "0.3"
rand = "0.10"
tracing = "0.1"

axum = "0.8"
bytes = "1"
http = "1"
http-body-util = "0.1"
# Only what the axum example drives by hand: hyper's HTTP/1 connection API on
# both sides. The h2 features come through moonpool-hyper, and the IO bridge
# (formerly tokio-util's Compat plus hyper-util's TokioIo) is HyperIo now.
hyper = { version = "1", features = ["http1", "server", "client"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0"
# Runtime-free tonic core: gRPC framing + codegen support without
# tonic::transport (which hard-codes tokio::spawn / TokioExecutor / TokioTimer).
prometheus = { version = "0.14", default-features = false }
prost = "0.14"
tonic = { version = "0.14", default-features = false, features = ["codegen"] }
tonic-prost = "0.14"

[build-dependencies]
tonic-prost-build = "0.14"

[dev-dependencies]
tower-service = "0.3"

[[bin]]
name = "sim-maze-explore"
path = "src/bin/sim/maze_explore.rs"

[[bin]]
name = "sim-dungeon-explore"
path = "src/bin/sim/dungeon_explore.rs"

[[bin]]
name = "sim-axum-web"
path = "src/bin/sim/axum_web.rs"

[[bin]]
name = "sim-metrics-service"
path = "src/bin/sim/metrics_service.rs"

[[bin]]
name = "sim-topology"
path = "src/bin/sim/topology.rs"

[[bin]]
name = "sim-tonic-grpc"
path = "src/bin/sim/tonic_grpc.rs"

[lints]
workspace = true
