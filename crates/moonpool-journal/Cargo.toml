[package]
name = "moonpool-journal"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "A CLSTORE journal over moonpool's storage providers: positions in any order, crash vs. corruption, identified damage"
documentation = "https://docs.rs/moonpool-journal"
readme = "README.md"
keywords.workspace = true
categories.workspace = true

# Built only on the provider traits and `BlockFile`, so the same journal runs
# over `TokioStorageProvider` in production and `SimStorageProvider` under
# simulation. No production providers are pulled in here.
[dependencies]
moonpool-core = { path = "../moonpool-core", version = "0.8.0", default-features = false }
# `hint!` names the moments inside a commit where a power loss is worth
# testing; zero dependencies, inert outside a simulation.
moonpool-buggify = { path = "../moonpool-buggify", version = "0.8.0" }
crc32c = "0.6"
thiserror = "2.0"

[dev-dependencies]
# The example runs the journal on the real filesystem.
moonpool-core = { path = "../moonpool-core", version = "0.8.0", default-features = false, features = ["tokio-fs"] }
moonpool-sim = { path = "../moonpool-sim", version = "0.8.0" }
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true
