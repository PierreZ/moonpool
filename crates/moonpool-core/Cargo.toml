[package]
name = "moonpool-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Core abstractions for the moonpool simulation framework"
documentation = "https://docs.rs/moonpool-core"
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[features]
default = ["tokio-providers", "select"]
# The Tokio backend: every production provider and `TokioProviders`.
# tokio/rt also serves spawn_blocking (positioned file I/O runs on the blocking
# pool) and the runtime metrics of TokioSystemProvider; libc supplies O_DIRECT,
# getrusage and sysconf; rand/thread_rng backs TokioRandomProvider.
tokio-providers = [
    "dep:tokio",
    "tokio/rt",
    "tokio/time",
    "tokio/net",
    "tokio/fs",
    "tokio/io-util",
    "dep:tokio-util",
    "dep:libc",
    "rand/thread_rng",
]
# The compio backend: a thread-per-core, completion-based runtime (io_uring on
# Linux, IOCP on Windows, polling elsewhere). Its types are not `Send`, so it
# implements the local provider traits only. The driver features pick io_uring
# where the kernel allows it and fall back to polling where it does not
# (a seccomp profile, an old kernel). libc supplies O_DIRECT, O_APPEND, the
# statx alignment query and the OS counters; rand/thread_rng backs the random
# provider, which is the same type as the Tokio one and needs no Tokio.
compio-providers = [
    "dep:compio",
    "compio/runtime",
    "compio/time",
    "compio/net",
    "compio/io-compat",
    "compio/fs",
    "compio/io-uring",
    "compio/polling",
    "dep:libc",
    "rand/thread_rng",
]
# `moonpool_core::select!` as a verbatim re-export of tokio's macro (production).
select = ["dep:tokio", "tokio/macros"]
# Deterministic `select!`: replaces the passthrough with tokio's expansion
# driven by a seeded start offset. Enabled by moonpool-sim; production graphs
# without moonpool-sim keep tokio's macro verbatim via `select`.
deterministic-select = ["select"]

[dependencies]
compio = { version = "0.19", default-features = false, optional = true }
futures = "0.3"
libc = { version = "0.2", optional = true }
rand = { version = "0.10", default-features = false }
thiserror = "2.0"
tokio = { version = "1.54", default-features = false, optional = true }
tokio-util = { version = "0.7", features = ["compat"], optional = true }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true

# docs.rs builds every optional module the crate documents.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
