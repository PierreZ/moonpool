[package]
name = "moonpool-wasm-demo"
version.workspace = true
publish = false
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "The run engine of the moonpool website: a replicated register simulated natively and in the browser"

[lib]
# cdylib for the wasm32 build (wasm-bindgen), rlib for the native bins + tests.
crate-type = ["cdylib", "rlib"]

# The small system of the website as an example simulation (cargo xtask sim run register).
[[bin]]
name = "sim-register"
path = "src/bin/sim_register.rs"

# Prints a run of the site's engine as JSON (scripts/check-site-wasm.sh).
[[bin]]
name = "site-run"
path = "src/bin/site_run.rs"

[dependencies]
# The simulator without its production (tokio net/fs) features is wasm-able.
moonpool-sim = { path = "../moonpool-sim", version = "0.8.0", default-features = false }
async-trait = "0.1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The scenario emits ordinary tracing events; the recorder reads them back.
tracing = "0.1"

[dev-dependencies]
# The exploration tree of the site (tests/exploration_tree.rs) runs the
# fork-based explorer natively; the library itself stays wasm-able.
moonpool-sim = { path = "../moonpool-sim", version = "0.8.0", default-features = false, features = ["exploration"] }

# wasm-only glue. The crate version MUST exactly match the flake's
# wasm-bindgen-cli (0.2.129) — a mismatch is the #1 wasm-bindgen footgun and
# produces an opaque "schema version" error at bindgen time. dependabot is told
# to ignore `wasm-bindgen*` (see .github/dependabot.yml) so it can't bump this
# out of sync with the CLI; bump both together when `nix flake update` moves the
# CLI (run `nix develop --command wasm-bindgen --version` and match it here).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
console_error_panic_hook = "0.1"

[lints]
workspace = true
