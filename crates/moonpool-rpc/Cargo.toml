[package]
name = "moonpool-rpc"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Typed dynamic-endpoint RPC over the moonpool provider traits"
documentation = "https://docs.rs/moonpool-rpc"
readme = "README.md"
keywords = ["rpc", "simulation", "distributed-systems", "deterministic"]
categories = ["network-programming"]

[features]
# The crate is generic over `moonpool_core::Providers` and ships no providers of
# its own. Features only choose payload codecs; the frame envelope is
# hand-written and codec-independent, so `--no-default-features` is still a
# working transport (applications implement `Wire` themselves) and builds for
# wasm32-unknown-unknown.
default = ["prost"]
# Protobuf payloads (the codec): every `prost::Message + Default` type is a
# `Wire` message, with Rust-defined `#[derive(prost::Message)]` structs.
prost = ["dep:prost"]
# `#[moonpool_rpc::service]`: typed interfaces, dispatchers and clients
# generated from a trait, on top of the manual API. Off by default so the
# production tree stays free of proc-macro dependencies unless asked for.
derive = ["dep:moonpool-rpc-derive"]
# Server-authenticated TLS 1.3 sessions over the provider streams
# (`security::tls`): rustls through futures-rustls with the ring provider.
# Native only (ring's entropy does not build for wasm32-unknown-unknown), so
# off by default; the dependency-free policy core in `security` is always
# compiled.
tls = ["dep:futures-rustls"]
# JWT/JWKS request verification (`security::jwt`): jsonwebtoken with its
# pure-Rust backend. Native only for the same reason, off by default.
jwt = ["dep:jsonwebtoken", "dep:serde", "dep:serde_json"]

[dependencies]
# Only the provider traits. Never moonpool-sim or moonpool-explorer: the
# simulation harness lives in the non-published moonpool-rpc-sim crate.
moonpool-core = { path = "../moonpool-core", version = "0.9.0", default-features = false }

futures = "0.3"
# TLS 1.3 only (no `tls12`), ring provider, no logging feature. It re-exports
# `rustls` and `rustls-pki-types`, so it is the only TLS dependency.
futures-rustls = { version = "0.26", default-features = false, features = ["ring"], optional = true }
# Pure-Rust backend: no C toolchain. Its `rsa` dependency carries
# RUSTSEC-2023-0071 (a timing side channel in RSA *private-key* operations);
# this crate only verifies signatures with public keys.
jsonwebtoken = { version = "11.1", default-features = false, features = ["rust_crypto"], optional = true }
moonpool-rpc-derive = { path = "../moonpool-rpc-derive", version = "0.9.0", optional = true }
# The payload codec. See `codec` for the selection record.
prost = { version = "0.14", default-features = false, features = ["std", "derive"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
thiserror = "2.0"
tracing = "0.1"
# Frame checksums: XXH3-64, the hash FDB's FlowTransport uses for the same
# purpose. Pure Rust, no C toolchain, builds for wasm32.
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[dev-dependencies]
# The generated interface is tested next to the manual one (tests/derive.rs)
# without turning the `derive` feature on for every test build.
moonpool-rpc-derive = { path = "../moonpool-rpc-derive", version = "0.9.0" }
# Real TCP: the production providers on both Tokio runtime flavors.
moonpool-core = { path = "../moonpool-core", version = "0.9.0", features = ["tokio-providers"] }
# `#[derive(prost::Message)]` in tests expands to `::prost` paths.
prost = "0.14"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "net", "io-util", "sync"] }
# Test PKI for the TLS tests: certificates with explicit validity dates.
rcgen = "0.14"
time = "0.3"
# Captures traces in the redaction tests.
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }

[[example]]
name = "recruitment"
required-features = ["prost"]

[[example]]
name = "balanced_mutation"
required-features = ["prost"]

[[example]]
name = "stream_saturation"
required-features = ["prost"]

[lints]
workspace = true
