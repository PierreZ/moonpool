[package]
name = "moonpool-rpc-derive"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Optional typed-interface generation for moonpool-rpc"
documentation = "https://docs.rs/moonpool-rpc-derive"
readme = "README.md"
keywords = ["rpc", "macro", "distributed-systems"]
categories = ["network-programming"]

# Ergonomics only: the generated code is plain moonpool-rpc manual API
# (groups, request streams, reply handles, bound clients). It owns no
# registry, protocol, delivery or retry semantics. Reached through
# moonpool-rpc's optional `derive` feature.
[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

[dev-dependencies]
# Compile-fail tests (tests/compile_fail.rs): the cases expand against the
# real crate, with the attribute reached the way users reach it.
moonpool-rpc = { path = "../moonpool-rpc", features = ["derive"] }
prost = "0.14"
trybuild = "1"

[lints]
workspace = true
