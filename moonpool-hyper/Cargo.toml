[package]
name = "moonpool-hyper"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "hyper 1.x integration for the moonpool provider traits"
documentation = "https://docs.rs/moonpool-hyper"
readme = "README.md"

[features]
# The runtime adapters (rt), the IO bridge and the tower/hyper service adapter
# need no hyper cargo feature at all, so `default-features = false` builds the
# featureless core of this crate. No tokio runtime is involved either way: the
# only tokio in the tree is `tokio/sync`, a non-optional dependency of hyper
# itself (synchronization primitives, no reactor, no timer, no executor).
default = ["client", "server"]
# h2 client side (the reconnecting channel).
client = ["hyper/client", "hyper/http2"]
# h2 server side (the per-connection serve helper).
server = ["hyper/server", "hyper/http2"]

[dependencies]
# Only the provider traits: this crate is generic over them and brings no
# production providers of its own.
moonpool-core = { path = "../moonpool-core", version = "0.8.0", default-features = false }

futures = "0.3"
# http/http-body types come through hyper's own re-exports so the versions stay
# in lockstep with whatever hyper we are compiled against.
hyper = { version = "1", default-features = false }
pin-project-lite = "0.2"
thiserror = "2.0"
tower-service = "0.3"
tracing = "0.1"

[dev-dependencies]
bytes = "1"
http-body-util = "0.1"
# The production providers, so the tests can instantiate the channels with a
# concrete Providers bundle: that is what proves hyper's sealed
# Http2ClientConnExec bound is satisfiable through our generics.
moonpool-core = { path = "../moonpool-core", version = "0.8.0", features = ["tokio-providers"] }
# A runtime for the tests that need one: hyper's h2 handshake spawns an internal
# task, so obtaining a real SendRequest takes a live executor.
tokio = { version = "1", features = ["rt", "macros", "time"] }

[lints]
workspace = true
