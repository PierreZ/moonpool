[profile.default]
# Flag a test SLOW after 1s, but only hard-kill it after 10s. CPU-heavy chaos
# tests are sub-second locally yet can exceed a tighter limit under parallel CI
# load; 10s still catches genuine hangs/deadlocks.
slow-timeout = { period = "1s", terminate-after = 10 }

# Show test output for hanging tests
failure-output = "immediate"
success-output = "never"

# Run tests in parallel
test-threads = "num-cpus"

# The metastable retry-storm example drives thousands of real gRPC calls through
# the simulator per run — under half a second in release, but several seconds in
# the debug profile tests are built with, and its determinism test does two runs.
# A wider budget for that one binary, still far short of a genuine hang.
[[profile.default.overrides]]
filter = 'binary(metastable_grpc_retry_storm)'
slow-timeout = { period = "10s", terminate-after = 6 }

# The bounded RPC campaigns run tens of seeds of full client/server traffic
# (the bit-flip scenario eighty, each thousands of frames) in the debug
# profile.
[[profile.default.overrides]]
filter = 'package(moonpool-rpc-sim)'
slow-timeout = { period = "10s", terminate-after = 6 }

[profile.default.junit]
# Store test results
path = "target/nextest/default/junit.xml"

# The compile-fail cases build moonpool-rpc and its dependencies in their
# own trybuild workspace on the first run: give them minutes, not seconds.
[[profile.default.overrides]]
filter = 'package(moonpool-rpc-derive) and binary(compile_fail)'
slow-timeout = { period = "60s", terminate-after = 10 }
