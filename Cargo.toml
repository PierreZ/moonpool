[workspace]

members = [
    "crates/moonpool",
    "crates/moonpool-assertions",
    "crates/moonpool-buggify",
    "crates/moonpool-calibrate",
    "crates/moonpool-core",
    "crates/moonpool-explorer",
    "crates/moonpool-hyper",
    "crates/moonpool-journal",
    "crates/moonpool-prometheus",
    "crates/moonpool-rpc",
    "crates/moonpool-rpc-derive",
    "crates/moonpool-rpc-sim",
    "crates/moonpool-sim",
    "crates/moonpool-sim-examples",
    "crates/moonpool-wasm-demo",
    "crates/xtask",
]
resolver = "2"

[workspace.package]
version = "0.8.0"
repository = "https://github.com/PierreZ/moonpool"
license = "Apache-2.0"
authors = ["Pierre Zemb <contact@pierrezemb.fr>"]
description = "Deterministic simulation testing for distributed systems in Rust"
documentation = "https://docs.rs/moonpool"
homepage = "https://pierrez.github.io/moonpool/"
keywords = ["simulation", "testing", "distributed-systems", "deterministic", "chaos"]
categories = ["development-tools::testing"]
edition = "2024"

[workspace.lints.rust]
async_fn_in_trait = "allow"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
disallowed_types = "deny"
# Rust 1.99 pedantic lint: wants `fn ... -> impl Future` + `std::future::ready`
# for async trait impls that never await. The `async fn` form mirrors the
# trait and reads better, so keep it.
unused_async_trait_impl = "allow"
# Rust 1.99 pedantic lint: its `assert_eq!(x, [] as [T; 0])` rewrite of
# `assert!(x.is_empty())` is noisier than the message it buys.
assert_is_empty = "allow"
